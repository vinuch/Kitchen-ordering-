version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: kitchen_ordering_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kitchen_ordering
    ports:
      - "5433:5432"
    volumes:
      - kitchen_ordering_postgres_data:/var/lib/postgresql/data

volumes:
  kitchen_ordering_postgres_data:
